name: Background job queue drain (every 15 minutes)

# Drains edu_jobs. /api/jobs/run is the ONLY consumer of that queue — nothing else calls
# processJobs() — so until this workflow existed, every job anything enqueued sat unprocessed
# forever. The endpoint is idempotent and retrying, so a repeat run never double-sends and a missed
# run costs only latency.
#
# Every 15 minutes via GitHub Actions rather than Vercel's daily-only Hobby cron: a queue drained
# once a day is a queue whose whole point (deliver reliably, soon) has been given up. vercel.json
# also carries a daily entry as a backstop for the case where Actions is unavailable, exactly as
# imap-poll.yml and its vercel.json entry already do.
#
# Reuses the CRON_SECRET / SITE_ORIGIN repo secrets already set up for imap-poll.yml and
# task-reminders.yml. No new configuration.

on:
  schedule:
    - cron: '3,18,33,48 * * * *'   # offset from imap-poll (*/10) and task-reminders (:07)
  workflow_dispatch:

# A slow run must never have a second run start on top of it: processJobs() claims with a lease, so
# an overlap is safe, but it is wasted capacity and doubles the log noise.
concurrency:
  group: jobs-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Hit the job runner
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_ORIGIN: ${{ secrets.SITE_ORIGIN }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not set."
            exit 1
          fi
          if [ -z "$SITE_ORIGIN" ]; then
            echo "::error::Repository secret SITE_ORIGIN is not set. Should be https://edurankai.in"
            exit 1
          fi

          echo "Hitting $SITE_ORIGIN/api/jobs/run ..."

          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -X GET "${SITE_ORIGIN}/api/jobs/run" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 120 || echo $'\nCURL_FAILED')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP_CODE=$HTTP_CODE"
          echo "BODY=$BODY"

          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "::error::Auth rejected. CRON_SECRET in this repo doesn't match Vercel's CRON_SECRET."
            exit 1
          fi
          if [ "$HTTP_CODE" = "CURL_FAILED" ] || [ "$HTTP_CODE" = "000" ]; then
            echo "::warning::Could not reach the endpoint. Will retry in 15 minutes."
            exit 0
          fi
          if [ "$HTTP_CODE" -ge 500 ] 2>/dev/null; then
            echo "::warning::Server returned $HTTP_CODE (likely cold-start). Will retry in 15 minutes."
            exit 0
          fi

          echo "Success."
