name: IMAP Poll (every 10 min)

# Runs on a schedule. Vercel Hobby blocks sub-daily crons; GitHub Actions
# crons are free and have no sub-daily limit. This workflow pings the
# /api/mail/imap-poll endpoint every 10 minutes with the CRON_SECRET so
# inbound mail keeps flowing without paying for Vercel Pro.
#
# One-time setup (do this once on GitHub):
#   Repository → Settings → Secrets and variables → Actions → New repository secret
#     Name: CRON_SECRET    Value: <same value you set in Vercel env vars>
#     Name: SITE_ORIGIN    Value: https://www.edurankai.in
#
# If you ever want to pause it: comment out the schedule block below or
# disable the workflow from the GitHub Actions tab.

on:
  schedule:
    # GitHub Actions cron runs in UTC. Every 10 minutes — note that GitHub
    # may delay runs by a minute or two under load; the IMAP poll is idempotent
    # so a small jitter doesn't matter.
    - cron: '*/10 * * * *'
  workflow_dispatch:  # also allow manual trigger from the Actions tab

# Failed polls must remain failed workflow runs so monitoring can detect them.

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # A failed poll is actionable; keep it visible as a failed run.
    permissions:
      contents: read
    steps:
      - name: Hit IMAP poll endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_ORIGIN: ${{ secrets.SITE_ORIGIN }}
        run: |
          set -euo pipefail

          # Sanity check the secrets are even present.
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Required repository secret CRON_SECRET is missing."
            exit 1
          fi
          if [ -z "$SITE_ORIGIN" ]; then
            echo "::error::Required repository secret SITE_ORIGIN is missing."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          safe_diagnostic_code() {
            local code
            code="$(jq -r '.diagnostic.code // empty' "$response_file" 2>/dev/null || true)"
            case "$code" in
              IMAP_AUTH_REJECTED|IMAP_MAILBOX_REJECTED|IMAP_COMMAND_REJECTED|IMAP_TLS_FAILURE|IMAP_DNS_FAILURE|IMAP_CONNECTION_TIMEOUT|IMAP_CONNECTION_FAILURE|IMAP_CONFIG_READ_FAILED|IMAP_NOT_CONFIGURED|IMAP_MESSAGE_PARSE_FAILED|IMAP_MESSAGE_PERSISTENCE_FAILED|IMAP_WATERMARK_PERSISTENCE_FAILED|IMAP_POLL_TIMEOUT|IMAP_LOGOUT_FAILED|IMAP_OPERATION_FAILED) printf '%s' "$code" ;;
              *) printf 'IMAP_POLL_FAILED' ;;
            esac
          }

          # The endpoint caps its poll at 90s. Never echo its response body: diagnostics are
          # intentionally redacted at the API boundary and the body can still contain provider data.
          if ! http_code="$(curl --silent --output "$response_file" --write-out '%{http_code}' \
            -X GET "${SITE_ORIGIN}/api/mail/imap-poll" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 120 2>/dev/null)"; then
            echo "::error::Could not reach the IMAP poll endpoint."
            exit 1
          fi

          if [ "$http_code" != "200" ]; then
            diagnostic_code="$(safe_diagnostic_code)"
            echo "::error::IMAP poll endpoint returned HTTP $http_code (diagnostic=$diagnostic_code)."
            exit 1
          fi

          if ! jq -e '.ok == true' "$response_file" >/dev/null 2>&1; then
            diagnostic_code="$(safe_diagnostic_code)"
            echo "::error::IMAP poll failed (diagnostic=$diagnostic_code)."
            exit 1
          fi

          fetched="$(jq -r 'if (.fetched | type) == "number" then .fetched else 0 end' "$response_file")"
          delivered="$(jq -r 'if (.delivered | type) == "number" then .delivered else 0 end' "$response_file")"
          echo "IMAP poll succeeded (fetched=$fetched delivered=$delivered)."
