# The headers rspamd writes onto every scanned message. These are exactly what
# src/mime/parse.ts:extractSpamVerdict() reads, so the engine's view of a message's spam score is
# rspamd's own verdict rather than a second opinion computed somewhere else.
use = ["x-spamd-result", "x-spam-level", "x-spam-status", "authentication-results"];
authenticated_headers = ["authentication-results"];
