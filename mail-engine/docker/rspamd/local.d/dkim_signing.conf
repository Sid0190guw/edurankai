# DKIM SIGNING IS DELIBERATELY OFF HERE.
#
# Two signers on one message produce two DKIM-Signature headers, and the second one is computed over
# a body the first one already committed to — receivers cope, but it is noise and it makes a broken
# signature much harder to diagnose.
#
# In this stack, mail submitted to the ENGINE is signed by the engine (src/dkim.ts) and mail that
# flows through Postfix is signed by OpenDKIM. Both read the same key files from ./keys and both use
# the same selector, so a message carries one signature and one DNS record verifies it either way.
enabled = false;
