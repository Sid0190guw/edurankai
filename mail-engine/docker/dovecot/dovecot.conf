# mail-engine/docker/dovecot/dovecot.conf — the mailbox store and the IMAP server.
#
# WHY DOVECOT IS HERE AT ALL, given that the product's mailbox lives in the application's database:
# because section 8 of the brief is right that the web application should not implement IMAP. This
# gives the organisation real mailboxes — postmaster@, abuse@, connect@ — with real folders and real
# flags, reachable from any mail client, and it gives the engine a standard way to read them
# (src/inbound/imap-sync.ts) rather than inventing a protocol.

protocols = imap lmtp
listen = *
base_dir = /run/dovecot
log_path = /dev/stderr
info_log_path = /dev/stdout

# ---------------------------------------------------------------------------
# Where mail lives
# ---------------------------------------------------------------------------
# Maildir, not mbox: one file per message, so a crash mid-write corrupts one message rather than a
# whole mailbox, and two processes can read while one writes.
mail_location = maildir:/var/mail/%d/%n
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 1000

namespace inbox {
  inbox = yes
  # THE FOLDERS THE BRIEF ASKS FOR, created automatically and subscribed automatically. A client
  # that has to create its own Sent folder puts it somewhere different from the next client, and
  # then two clients disagree about where sent mail is.
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Spam {
    special_use = \Junk
    auto = subscribe
  }
}

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# A flat passwd-file, because this is an organisational-mailbox store with a handful of accounts,
# not the user directory — the application owns users. Passwords are hashed (see users.example).
passdb {
  driver = passwd-file
  args = scheme=ARGON2ID username_format=%u /etc/dovecot/users
}
userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
  default_fields = uid=vmail gid=vmail home=/var/mail/%d/%n
}

disable_plaintext_auth = yes
auth_mechanisms = plain login

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
service lmtp {
  # Postfix delivers accepted mail here. inet rather than a socket, because they are separate
  # containers; the port is not published to the host.
  inet_listener lmtp {
    address = 0.0.0.0
    port = 24
  }
}

service auth {
  # Postfix asks Dovecot to check submission credentials, so there is ONE user list and one place a
  # password can be wrong.
  inet_listener {
    address = 0.0.0.0
    port = 12345
  }
}

service imap-login {
  inet_listener imap {
    # Cleartext IMAP is refused above by disable_plaintext_auth; the port stays open only so a
    # client that tries it gets a clear "use TLS" rather than a connection refused.
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------
ssl = required
ssl_cert = </etc/mail/certs/fullchain.pem
ssl_key = </etc/mail/certs/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = no

# ---------------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------------
# Deliver into the Spam folder when rspamd flagged the message, rather than into the inbox.
protocol lmtp {
  mail_plugins = $mail_plugins sieve
}
plugin {
  sieve = /var/mail/%d/%n/.dovecot.sieve
  sieve_default = /etc/dovecot/default.sieve
  sieve_default_name = default
}

# An IMAP client that idles is a client that gets new mail instantly and polls zero times.
imap_idle_notify_interval = 2 mins
mail_max_userip_connections = 20
