# mail-engine/docker/opendkim/opendkim.conf

Syslog                  yes
UMask                   007
Socket                  inet:8891@0.0.0.0
PidFile                 /run/opendkim/opendkim.pid
Background              no

# sv = sign outgoing mail AND verify incoming. Verification is what puts a result into
# Authentication-Results, which is what a DMARC evaluation later reads.
Mode                    sv
Canonicalization        relaxed/simple
# relaxed/simple: relaxed header canonicalisation survives the whitespace changes MTAs make in
# transit; simple body canonicalisation is stricter but the body is not rewritten in practice.

KeyTable                /etc/opendkim/KeyTable
SigningTable            refile:/etc/opendkim/SigningTable
ExternalIgnoreList      refile:/etc/opendkim/TrustedHosts
InternalHosts           refile:/etc/opendkim/TrustedHosts

# The headers to sign. Matches DKIM_HEADER_FIELDS in src/dkim.ts, deliberately: a message must
# verify identically whether it was signed by OpenDKIM on the Postfix path or by the Node engine.
SignHeaders             from,to,cc,subject,date,message-id,mime-version,content-type,reply-to

# oversign From. Without this, an attacker can ADD a second From header to a signed message; the
# signature still verifies over the original, while mail clients display the added one.
OversignHeaders         From

SubDomains              no
AlwaysAddARHeader       yes
MinimumKeyBits          1024
