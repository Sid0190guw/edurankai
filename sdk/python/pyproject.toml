[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edurankai-mail"
version = "1.0.0"
description = "Official Python client for the EduRankAI Mail transactional email API."
requires-python = ">=3.9"
# No runtime dependencies, deliberately: urllib, hmac, hashlib and json are enough, and an SDK that
# pulls a dependency tree into a customer's service eventually breaks their build for a reason that
# has nothing to do with email.
dependencies = []

[tool.setuptools]
packages = ["edurankai_mail"]
