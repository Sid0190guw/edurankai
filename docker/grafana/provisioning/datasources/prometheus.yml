# Grafana datasource provisioning.
#
# Provisioned rather than clicked in, so a Grafana container rebuilt from scratch comes up with the
# same datasource UID the dashboards reference. A dashboard whose datasource UID does not exist
# renders every panel as "Datasource not found", which reads as a broken dashboard rather than a
# missing datasource.

apiVersion: 1

datasources:
  - name: Prometheus
    # The dashboards in docker/grafana/dashboards reference this UID literally. Do not change it
    # without changing them.
    uid: era-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Must be >= the largest scrape_interval in prometheus.yml (60s for the app job), or Grafana
      # requests a step finer than the data and draws gaps between real points.
      timeInterval: 60s
      httpMethod: POST
