# Grafana dashboard provisioning — loads every .json in /var/lib/grafana/dashboards.
#
# The dashboards are files in the repository, not database rows edited in the UI. That means a
# dashboard change is a diff someone can review, and a rebuilt Grafana is not a lost dashboard.
#
# The trade: `allowUiUpdates: false`. Editing a panel in the browser shows a "cannot save" message.
# That is intentional — a saved-in-UI change survives until the next container restart and then
# vanishes, which is worse than not being able to save at all. Edit the JSON, restart Grafana.

apiVersion: 1

providers:
  - name: edurankai-mail
    orgId: 1
    folder: EduRankAI Mail
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
