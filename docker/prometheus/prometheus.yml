# docker/prometheus/prometheus.yml — what gets scraped, and how often.
#
# THE INTERVALS ARE NOT UNIFORM ON PURPOSE. /api/metrics on the app runs several database queries
# per scrape; on the Supabase transaction pooler a connection is a scarce resource and a metrics
# scrape that competes with user traffic is a self-inflicted incident. The stack's own services are
# free to scrape (they answer from memory), so they are scraped fast and the app is scraped slowly.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    stack: edurankai-mail
    host: zbook

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # --- the mail stack's own aggregator ---------------------------------------------------------
  # One target that probes every component and reports era_mailops_component_up per component.
  - job_name: mailops
    scrape_interval: 15s
    static_configs:
      - targets: ["mailops:9100"]

  # --- the small Node services, each reporting its own counters ---------------------------------
  - job_name: mail-parser
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["mail-parser:1081"]

  - job_name: mail-worker
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["mail-worker:1082"]

  - job_name: smtp-sink
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["smtp-sink:1080"]

  # --- the application -------------------------------------------------------------------------
  #
  # SLOW ON PURPOSE: 60s. Every scrape is several queries against Postgres. See the header.
  #
  # THE BEARER TOKEN IS READ FROM A FILE, not written here. Prometheus does not expand environment
  # variables in most config fields, so an inline token would have to be committed — and this file
  # is in the repository. Create the file before starting the stack:
  #
  #     printf '%s' "$METRICS_TOKEN" > docker/prometheus/metrics_token
  #
  # ./scripts/start-mail.sh --observability writes it for you from .env.local. If the file is
  # absent Prometheus starts and this job fails with 404 (the endpoint hides itself when
  # METRICS_TOKEN is unset app-side), which is visible on the Targets page rather than silent.
  - job_name: app
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["app:4321"]

  # --- deployed application (Vercel) -------------------------------------------------------------
  #
  # Commented out because it points at production and must be a deliberate act. The local Prometheus
  # CAN scrape the deployed app — it is the only way to see production queue depth on this
  # dashboard — but it means a laptop is polling production every minute, and the token in the file
  # is then a production credential. Uncomment only after reading docs/mail/OBSERVABILITY.md §4.
  #
  # - job_name: app-production
  #   scheme: https
  #   scrape_interval: 300s
  #   metrics_path: /api/metrics
  #   authorization:
  #     type: Bearer
  #     credentials_file: /etc/prometheus/metrics_token_production
  #   static_configs:
  #     - targets: ["www.edurankai.in"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
