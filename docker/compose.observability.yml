# docker/compose.observability.yml — Prometheus and Grafana.
#
#   ./scripts/start-mail.sh --observability
#
# BOTH BIND TO LOOPBACK. Prometheus has no authentication of its own and its API can read every
# series it holds; Grafana ships with a default admin login. Neither belongs on a laptop's public
# interfaces. Reach them at http://localhost:9090 and http://localhost:3001 on the ZBook itself, or
# over an SSH tunnel from elsewhere.
#
# WHAT THIS DOES NOT INCLUDE, deliberately:
#   - Alertmanager. An alerting pipeline with nowhere to send an alert is theatre. The rules are
#     written (prometheus/alerts.yml) and Prometheus will evaluate them and show them as firing in
#     its own UI; wiring a destination is a decision about who gets woken up, which is not a
#     decision this file should make. docs/mail/OBSERVABILITY.md section 5.
#   - Loki / log aggregation. Logs are structured JSON on stdout and `docker compose logs` reads
#     them. At one node that is genuinely enough; the pipeline earns its keep at several.

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT_PROMETHEUS:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days. Long enough to compare this week to last; short enough that the TSDB does not
      # quietly fill a laptop's SSD. Raise it only after checking free space.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    environment:
      # Read by prometheus.yml for the /api/metrics bearer token. Prometheus expands ${VAR} only in
      # a few fields, so the token is provided via a file (see prometheus.yml) rather than inline.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    networks: [mail]

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT_GRAFANA:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.local — the default admin/admin is a public login}
      # Nobody signs up for a local dashboard, and anonymous access on a box that also holds mail
      # metadata is not a convenience worth having.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    depends_on: [prometheus]
    networks: [mail]
